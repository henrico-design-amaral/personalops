name: Validate PersonalOps

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  PUBLIC_SITE_URL: https://personalops.henrico.works
  PUBLIC_BASE_PATH: /
  E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
  E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
  E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
  E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

jobs:
  quality:
    name: Quality, RLS and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Confirm required environment
        shell: bash
        run: |
          for name in PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_PUBLISHABLE_KEY E2E_USER_A_EMAIL E2E_USER_A_PASSWORD E2E_USER_B_EMAIL E2E_USER_B_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required repository secret is missing: $name"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source, tests and migrations
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Prove row-level isolation
        run: npm run test:rls

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise critical browser flows
        run: npm run test:e2e

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            output/playwright
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
