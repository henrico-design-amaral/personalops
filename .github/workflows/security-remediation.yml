name: Security Remediation Probe

on:
  push:
    branches: [chore/security-hardening-v14]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/security-hardening-v14
      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm audit fix
        run: npm audit fix --package-lock-only
      - name: Commit lockfile remediation when changed
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No lockfile changes produced.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'chore: remediate dependency advisories'
            git push origin HEAD:chore/security-hardening-v14
          fi
      - name: Audit high severity production dependencies
        run: npm audit --audit-level=high
      - name: Restore missing V1.4 fixtures
        shell: bash
        run: |
          cp assets/data/exercises.json public/assets/data/exercises.json
          cp assets/data/invoices.json public/assets/data/invoices.json
          cp assets/data/payment-events.json public/assets/data/payment-events.json
      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/data-store.js
      - name: Validate fixtures
        run: npm run validate:fixtures
      - name: Validate access control
        run: npm run test:access
      - name: Build
        env:
          PUBLIC_SITE_URL: https://personalops.henrico.works
          PUBLIC_BASE_PATH: /
        run: npm run build
